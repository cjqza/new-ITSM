spring:
  application:
    name: itsm-server
  datasource:
    url: jdbc:mysql://localhost:3306/itsm?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: 1234
    driver-class-name: com.mysql.cj.jdbc.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true
  data:
    redis:
      host: localhost
      port: 6379
      timeout: 3s

server:
  address: 0.0.0.0
  port: 8080

itsm:
  auth:
    issuer: itsm-auth-service
    audience: itsm
    access-token-ttl-seconds: 7200
    refresh-token-ttl-seconds: 1209600
    login-failure-lock-threshold: 5
    login-lock-minutes: 15
    bcrypt-strength: 10
    jwt:
      secret: itsm-dev-secret-please-change-in-production-itsm-dev-secret-please-change-in-production
      public-key: ""
      private-key: ""
    seed:
      enabled: true
      tenant-id: tenant_001
      tenant-name: 示例企业
      user-id: usr_10001
      login-name: zhangsan
      password: P@ssw0rd123
      sso-code: one-time-code
      display-name: 张三
      department-name: 技术支持部
      roles: USER
  register:
    expose-verification-code: true
    code-ttl-seconds: 60
    code-length: 6
    rate-limit-max-per-ip: 5
    rate-limit-window-seconds: 60
    default-role-code: USER

springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
  packages-to-scan: com.cenziang.itsmserver.api

knife4j:
  enable: true
  setting:
    language: zh_cn
    enable-swagger-models: true
    enable-document-manage: true